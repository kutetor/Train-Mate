<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exercises | Train Mate</title>

    <meta
        name="description"
        content="Explore strength and cardio exercises for different experience levels with Train Mate."
    >

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/exercises.css">

    <!-- JavaScript -->
    <script src="js/exercises.js"></script>
</head>

<body>

    <!-- Header -->
    <header>

        <!-- Navigation -->
        <nav class="navbar">

            <!-- Logo -->
            <a href="index.html" class="logo">Train Mate</a>

            <!-- Navigation links -->
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="exercises.html" aria-current="page">Exercises</a></li>
                <li><a href="about.html">About</a></li>
            </ul>

            <!-- Main navigation action -->
            <a href="workout.html" class="btn">Build Workout</a>

        </nav>

    </header>

    <!-- Main content -->
    <main>

        <!-- Exercise library introduction -->
        <section class="exercise-intro">

            <h1>Exercise Library</h1>

            <p>
                Explore strength and cardio exercises and find exercises
                that match your experience level.
            </p>

        </section>

        <!-- Exercise controls -->
        <section class="exercise-controls">

            <!-- Search -->
            <div class="search-box">
                <label for="exercise-search">Search exercises</label>

                <input
                    type="search"
                    id="exercise-search"
                    placeholder="Search exercises..."
                >
            </div>

            <!-- Filters -->
            <div class="filters">

                <!-- Type filter -->
                <div class="filter-group">
                    <label for="type-filter">Type</label>

                    <select id="type-filter">
                        <option value="all">All</option>
                        <option value="strength">Strength</option>
                        <option value="cardio">Cardio</option>
                    </select>
                </div>

                <!-- Level filter -->
                <div class="filter-group">
                    <label for="level-filter">Experience Level</label>

                    <select id="level-filter">
                        <option value="all">All</option>
                        <option value="beginner">Beginner</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="advanced">Advanced</option>
                    </select>
                </div>

            </div>

        </section>

        <!-- Exercise library -->
        <section class="exercise-library">

            <h2>Exercises</h2>

            <!-- Exercise cards are generated with JavaScript -->
            <div id="exercise-grid" class="exercise-grid">

            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer>

        <p>&copy; 2026 Train Mate</p>

        <!-- Footer navigation -->
        <nav class="footer-nav">
            <a href="index.html">Home</a>
            <a href="exercises.html">Exercises</a>
            <a href="about.html">About</a>
            <a href="workout.html">Build Workout</a>
        </nav>

    </footer>

</body>

</html>
