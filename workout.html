<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Workout Builder | Train Mate</title>

    <meta
        name="description"
        content="Create a simple full-body workout based on your training goal, experience level, and available time."
    >

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/workout.css">

    <!-- JavaScript -->
    <script src="js/workout.js"></script>
</head>

<body>

    <!-- Header -->
    <header>

        <!-- Navigation -->
        <nav class="navbar">

            <!-- Logo -->
            <a href="index.html" class="logo">Train Mate</a>

            <!-- Navigation links -->
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="exercises.html">Exercises</a></li>
                <li><a href="about.html">About</a></li>
            </ul>

            <!-- Main navigation action -->
            <a href="workout.html" class="btn" aria-current="page">Build Workout</a>

        </nav>

    </header>

    <!-- Main content -->
    <main>

        <!-- Workout builder introduction -->
        <section class="workout-intro">

            <h1>Build Your Workout</h1>

            <p>
                Tell us about yourself and your training preferences.
                Train Mate will create a simple full-body workout for you.
            </p>

        </section>

        <!-- Workout form -->
        <section class="workout-builder">

            <h2>Your Training Information</h2>

            <form id="workout-form">

                <!-- Name -->
                <div class="form-group">
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                    >
                </div>

                <!-- Age -->
                <div class="form-group">
                    <label for="age">Age</label>
                    <input
                        type="number"
                        id="age"
                        name="age"
                        min="16"
                        max="100"
                        required
                    >
                </div>

                <!-- Weight -->
                <div class="form-group">
                    <label for="weight">Weight (kg)</label>
                    <input
                        type="number"
                        id="weight"
                        name="weight"
                        min="30"
                        max="250"
                        required
                    >
                </div>

                <!-- Height -->
                <div class="form-group">
                    <label for="height">Height (cm)</label>
                    <input
                        type="number"
                        id="height"
                        name="height"
                        min="120"
                        max="230"
                        required
                    >
                </div>

                <!-- Training goal -->
                <div class="form-group">
                    <label for="goal">Training Goal</label>

                    <select id="goal" name="goal" required>
                        <option value="">Choose a goal</option>
                        <option value="build-muscle">Build Muscle</option>
                        <option value="lose-fat">Lose Fat</option>
                    </select>
                </div>

                <!-- Experience level -->
                <div class="form-group">
                    <label for="experience">Experience Level</label>

                    <select id="experience" name="experience" required>
                        <option value="">Choose your experience level</option>
                        <option value="beginner">Beginner</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="advanced">Advanced</option>
                    </select>
                </div>

                <!-- Workout duration -->
                <div class="form-group">
                    <label for="duration">Workout Duration</label>

                    <select id="duration" name="duration" required>
                        <option value="">Choose workout duration</option>
                        <option value="30">30 minutes</option>
                        <option value="45">45 minutes</option>
                        <option value="60">60 minutes</option>
                    </select>
                </div>

                <!-- Submit button -->
                <button type="submit" class="btn">
                    Generate My Workout
                </button>

            </form>

        </section>

        <!-- Generated workout result -->
        <section id="workout-result" class="workout-result">

            <h2>Your Workout</h2>

            <!-- Workout content will be generated with JavaScript -->
            <div id="workout-content">

            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer>

        <p>&copy; 2026 Train Mate</p>

        <!-- Footer navigation -->
        <nav class="footer-nav">
            <a href="index.html">Home</a>
            <a href="exercises.html">Exercises</a>
            <a href="about.html">About</a>
            <a href="workout.html">Build Workout</a>
        </nav>

    </footer>

</body>

</html>
